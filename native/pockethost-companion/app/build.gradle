plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.pockethost.companion'
    compileSdk 36

    defaultConfig {
        applicationId 'pl.pockethost.companion'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.3.1'
    }

    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
