plugins {
    id 'com.android.application'
}

def probeNative = layout.buildDirectory.file('probe-native/arm64-v8a/libpockethost_probe.so')
def probeNativeFile = probeNative.get().asFile

android {
    namespace 'pl.pockethost.runtimeprobe'
    compileSdk 36

    defaultConfig {
        applicationId 'pl.pockethost.runtimeprobe'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.0.1-spike'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // An executable is unpacked from the APK's native-library directory.
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += [layout.buildDirectory.dir('probe-native').get().asFile]
        }
    }
}

// Only the ARM64 Termux toolchain can compile this disposable Android worker.
// Do not copy existing Termux binaries or executable paths into this APK.
tasks.register('compileOwnedProbeWorker', Exec) {
    inputs.file('src/main/cpp/probe_worker.c')
    outputs.file(probeNativeFile)
    doFirst { probeNativeFile.parentFile.mkdirs() }
    executable 'clang'
    args '-O2', '-fPIE', '-pie', '-Wl,-z,max-page-size=16384',
         '-o', probeNativeFile.absolutePath,
         file('src/main/cpp/probe_worker.c').absolutePath
}

tasks.named('preBuild') {
    dependsOn('compileOwnedProbeWorker')
}
