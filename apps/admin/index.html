<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.png" type="image/x-icon">
    <link rel="icon" href="favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PocketHost — Local Admin</title>
    <meta name="description" content="PocketHost local Android Termux administration panel.">
    <!-- Paint the browser's saved color theme before Vite/React or stylesheet downloads. -->
    <style>
      :root { background: #fff; color-scheme: light; }
      @media (prefers-color-scheme: dark) { :root { background: #171717; color-scheme: dark; } }
      :root.dark { background: #171717; color-scheme: dark; }
      :root.light { background: #fff; color-scheme: light; }
      body { margin: 0; min-height: 100vh; background: inherit; }
    </style>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("vite-ui-theme");
          const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.add(
            saved === "light" || saved === "dark" ? saved : (systemDark ? "dark" : "light")
          );
        } catch {
          document.documentElement.classList.add(
            matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
